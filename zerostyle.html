<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="RAT-DRAW" content="Its not looking good" lang="en" />
  <title>"Its gonna be joever"</title>
  <script src="the_thing_that_does_the_thing.js" defer></script>
</head>
<body>
  <h1>rat-draw</h1>
  <p> crazy crazy   tom </p>
  <canvas id="canvas" width = "1440" height="480"></canvas>
  <div>
    <input type="color" id="color_picker" value="#000000">
    <input type="range" id="brush_thicckness" min="0" max="100">
    <input type="button" id="clear_canvas" value="clear canvas">
    <label for="Brush">Choose a brush:</label>
    <select name="Brush Selector" id="brush_selector">
      <option value="brush" selected>Brush</option>
      <option value="rect_outline">Rectangle Outline</option>
      <option value="rect_fill">Rectangle Fill</option>
      <option value="circle_outline">Circle Outline</option>
      <option value="circle_fill">Circle Fill</option>
      <option value="line">Straight Line</option>
      <option value="triangle_fill">Triangle Fill</option>
      <option value="triangle_outline">Triangle Outline</option>
    </select>
    <input type="button" id="selection_lasso" value="lasso">
    <input type="file" id="image-upload" accept=".png , .jpg , .jpeg">
    <input type="text" id="insert-text" value="Add Text">
    <input type="button" id="undo" value="undo">
    <input type="button" id="redo" value="redo">
  </div>
</body>
</html>
